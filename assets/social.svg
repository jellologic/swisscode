<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="150" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#da291c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#da291c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Logo + wordmark, centered -->
  <g transform="translate(410,120)">
    <rect x="0" y="0" width="120" height="120" rx="27" fill="#da291c"/>
    <g transform="scale(1.2)">
      <path d="M30 34 L54 50 L30 66" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="41" width="13" height="18" rx="3" fill="#ffffff"/>
    </g>
    <text x="150" y="90" font-size="96" font-weight="800" letter-spacing="-3">
      <tspan fill="#f0f6fc">swiss</tspan><tspan fill="#ff5a4d">code</tspan>
    </text>
  </g>

  <text x="640" y="330" font-size="30" font-weight="600" fill="#e6edf3" text-anchor="middle">Every Claude account. Automatic rate-limit failover.</text>
  <text x="640" y="374" font-size="20" fill="#7d8590" text-anchor="middle">multi-account vault &#183; localhost proxy &#183; usage limits &#183; traffic inspector</text>

  <!-- Feature chip row, centered -->
  <g font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="17" transform="translate(351,430)">
    <rect x="0" y="0" width="148" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="74" y="26" fill="#adbac7" text-anchor="middle">subscription</text>
    <rect x="160" y="0" width="128" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="224" y="26" fill="#adbac7" text-anchor="middle">openrouter</text>
    <rect x="300" y="0" width="179" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="389" y="26" fill="#adbac7" text-anchor="middle">custom endpoint</text>
    <rect x="491" y="0" width="87" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
    <text x="534" y="26" fill="#adbac7" text-anchor="middle">web ui</text>
  </g>

  <text x="640" y="560" font-size="18" fill="#6e7681" text-anchor="middle" font-family="Menlo, monospace">npm i -g swisscode   &#183;   github.com/jellologic/swisscode</text>
</svg>
